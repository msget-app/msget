name: MacSpec

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macspec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary (macOS 11+, arm64 + x86_64)
        run: |
          swiftc -O -target arm64-apple-macos11.0 MacSpec.swift -o macspec-arm64
          swiftc -O -target x86_64-apple-macos11.0 MacSpec.swift -o macspec-x86_64
          lipo -create macspec-arm64 macspec-x86_64 -output macspec
          lipo -info macspec

      # Smoke check: exactly one non-empty Base64 line; never print it (device identifiers).
      - name: Smoke test
        run: |
          ./macspec > out.txt
          test "$(wc -l < out.txt | tr -d ' ')" = "1"
          grep -Eq '^[A-Za-z0-9+/=]+$' out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macspec
          path: macspec

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" macspec --clobber
          else
            gh release create "$GITHUB_REF_NAME" macspec --generate-notes
          fi
